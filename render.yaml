services:
  - type: web
    name: trustvision-backend
    env: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/trustvision-dataset-api-1.0.0.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://<host>:5432/trustvision
      - key: DB_USERNAME
        value: trustvision
      - key: DB_PASSWORD
        value: your_db_password
      - key: SERVER_PORT
        value: 8080
      - key: AI_ENGINE_BASE_URL
        value: https://your-ai-engine-url
      - key: PROVENANCE_ENGINE_BASE_URL
        value: https://your-provenance-engine-url
      - key: APP_OWNER_USERNAME
        value: system
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.com
