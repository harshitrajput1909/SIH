services:
  - type: web
    name: trustvision-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_OWNER_USERNAME
        value: system
      - key: STORAGE_ROOT
        value: ./workspace/storage
      - key: AI_ENGINE_BASE_URL
        sync: false
      - key: AI_ENGINE_POLL_INTERVAL
        value: 2s
      - key: AI_ENGINE_TIMEOUT
        value: 15m
      - key: PROVENANCE_ENGINE_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
