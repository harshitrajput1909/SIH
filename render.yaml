services:
  - type: web
    name: trustvision-backend
    env: java
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: mvn -B clean package -DskipTests
    startCommand: java -jar target/trustvision-dataset-api-1.0.0.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AI_ENGINE_BASE_URL
        sync: false
      - key: PROVENANCE_ENGINE_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
