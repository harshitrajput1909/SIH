spring.config.activate.on-profile=production

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

server.port=${PORT:8080}

app.storage.root=${STORAGE_ROOT:./workspace/storage}
app.owner-username=${APP_OWNER_USERNAME:system}
app.ai-engine.base-url=${AI_ENGINE_BASE_URL}
app.ai-engine.poll-interval=${AI_ENGINE_POLL_INTERVAL:2s}
app.ai-engine.timeout=${AI_ENGINE_TIMEOUT:15m}
app.provenance-engine.base-url=${PROVENANCE_ENGINE_BASE_URL}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10GB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:11GB}
