spring:
  application:
    name: trustvision-dataset-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/trustvision}
    username: ${DB_USERNAME:trustvision}
    password: ${DB_PASSWORD:trustvision}
  jpa:
    hibernate:
      ddl-auto: none        # schema is owned by Flyway (V1__dataset_assurance.sql)
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 11GB

app:
  storage:
    root: ${STORAGE_ROOT:./workspace/storage}
  owner-username: ${APP_OWNER_USERNAME:system}
  ai-engine:
    base-url: ${AI_ENGINE_BASE_URL:http://localhost:8100}
    poll-interval: ${AI_ENGINE_POLL_INTERVAL:2s}
    timeout: ${AI_ENGINE_TIMEOUT:15m}
  provenance-engine:
    base-url: ${PROVENANCE_ENGINE_BASE_URL:http://localhost:8200}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
